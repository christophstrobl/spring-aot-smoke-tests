plugins {
	id "java"
	id "org.springframework.boot"
	id "org.springframework.aot.smoke-test"
	id "org.graalvm.buildtools.native"
}

repositories {
	mavenLocal()
}

dependencies {
	implementation(platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES))
	implementation("org.springframework.boot:spring-boot-starter-data-jpa")
	constraints {
		implementation('org.springframework.data:spring-data-commons:4.0.0-M3')
		implementation('org.springframework.data:spring-data-jpa:4.0.x-GH-3905-SNAPSHOT')
		implementation('org.hibernate.orm:hibernate-core:7.0.0.Final')
	}

	runtimeOnly("com.h2database:h2")

	testImplementation("org.springframework.boot:spring-boot-starter-test")

	appTestImplementation(project(":aot-smoke-test-support"))
	appTestImplementation("org.awaitility:awaitility:4.2.0")
}
